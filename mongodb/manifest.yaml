apiVersion: v1
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev
spec:
  clusterIP: None
  selector:
    # labels are used as selectors
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev
  ports:
  - protocol: TCP
    port: 27017 # servie port
    targetPort: 27017 # container port
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev
spec:
  serviceName: "mongodb-headless"
  replicas: 1
  selector:
    matchLabels:
      project: Roboshop
      tier: database
      component: mongodb
      environment: dev
  template:
    metadata:
      labels:
        project: Roboshop
        tier: database
        component: mongodb
        environment: dev
    spec:
      containers:
      - name: mongodb
        image: devzonefun/mongodb:2.0.0
      volumeMounts:
      - name: mongodb
        mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClass: roboshop-ebs
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev
spec:
  selector:
    # labels are used as selectors
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev
  ports:
  - protocol: TCP
    port: 27017 # servie port
    targetPort: 27017 # container port
